# Backtest config for `nautilus-backtest`, matching the `engine-ema-cross` example.
#
# From the `rt` directory:
#
#   cargo build
#   cargo run --bin nautilus-backtest -- --config plugins/ema_cross/backtest.toml

synthetic_cycles = 6

[[strategies]]
path = "target/debug/libema_cross_plugin.so"
type_name = "EmaCross"

[strategies.config]
instrument_id = "AUD/USD.SIM"
trade_size = "100000"
fast_period = 10
slow_period = 20
