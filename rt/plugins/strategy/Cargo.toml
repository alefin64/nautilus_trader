# Strategy slot: the one crate a strategy author edits.
#
# FROZEN. Do not edit this file. Edit only `src/`. The runtime fingerprints `rt/Cargo.toml` and
# `rt/Cargo.lock`, so adding a dependency here or anywhere else in the workspace changes the
# build, and workers refuse the plug-in. Anything a strategy needs beyond `nautilus-rt`'s
# re-exports must be added to `nautilus-rt` in the engine repository.

[package]
name = "strategy-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Strategy slot: a bar-based strategy built as a Nautilus strategy plug-in"
publish = false

[lints]
workspace = true

# Library file: target/<profile>/libstrategy_plugin.so
[lib]
name = "strategy_plugin"
crate-type = ["dylib"]

[dependencies]
nautilus-rt = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
